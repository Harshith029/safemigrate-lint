[project]
name = "safemigrate-lint"
version = "1.3.0"
description = "Lint Postgres migration SQL for the dangerous operations that break production — as a GitHub Action, CLI, or pre-commit hook."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pali Krishna Harshith" }]
keywords = [
    "postgres",
    "postgresql",
    "migration",
    "migrations",
    "linter",
    "lint",
    "sql",
    "ci",
    "github-action",
    "pre-commit",
    "database",
    "schema",
    "dba",
    "devops",
    "zero-downtime",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pglast>=6.0",
]

[project.urls]
Homepage = "https://github.com/Harshith029/safemigrate-lint"
Repository = "https://github.com/Harshith029/safemigrate-lint"
Changelog = "https://github.com/Harshith029/safemigrate-lint/blob/master/CHANGELOG.md"
Issues = "https://github.com/Harshith029/safemigrate-lint/issues"

[project.scripts]
safemigrate-lint = "safemigrate_lint.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safemigrate_lint"]

[tool.hatch.build.targets.sdist]
# Keep launch/marketing drafts and the demo image (referenced by absolute URL)
# out of the published source distribution. .dockerignore is repo-local tooling
# with no meaning to an sdist consumer — the Action image builds from the git
# checkout (action.yml `image: Dockerfile`), never from the sdist.
#
# .gitignore cannot be excluded here: hatchling force-includes VCS exclusion
# files so the sdist reproduces the same file selection, and force_include
# overrides exclude. Turning that off (ignore-vcs) would mean re-listing every
# ignored path by hand — a worse trade than shipping the file.
exclude = [
    "/marketing",
    "/docs/demo.png",
    "/.dockerignore",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = false
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
