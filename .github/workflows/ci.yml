name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (frozen lockfile)
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Lint with ruff
        run: uv run --python ${{ matrix.python-version }} ruff check src/ tests/ docker/

      - name: Type-check with mypy
        run: uv run --python ${{ matrix.python-version }} mypy src/ docker/

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -v

  # The Docker image is what users actually run when they reference this action,
  # and nothing in CI built it — a broken Dockerfile or entrypoint would only
  # surface in someone else's pull request.
  action-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build the action image
        run: docker build -t safemigrate-lint:ci .

      - name: Image must not run as root
        run: |
          uid=$(docker run --rm --entrypoint id safemigrate-lint:ci -u)
          echo "container uid: $uid"
          if [ "$uid" = "0" ]; then
            echo "::error::action image runs as root"
            exit 1
          fi

      - name: Lint a migration through the real entrypoint
        run: |
          # Findings exit non-zero by contract, so capture rather than fail on it.
          set +e
          out=$(docker run --rm \
            -v "$PWD/fixtures:/github/workspace/fixtures:ro" -w /github/workspace \
            -e INPUT_PATHS='fixtures/migrations/subtle_05_refresh_matview_blocking.sql' \
            -e INPUT_SEVERITY='critical,warning' -e INPUT_FORMAT='json' \
            safemigrate-lint:ci)
          code=$?
          set -e
          echo "$out"
          echo "exit code: $code"
          [ "$code" -eq 1 ] || { echo "::error::expected exit 1 (findings), got $code"; exit 1; }
          echo "$out" | grep -q 'refresh-matview-blocks-reads' \
            || { echo "::error::expected finding missing from output"; exit 1; }

      - name: A clean migration must exit 0
        run: |
          docker run --rm \
            -v "$PWD/fixtures:/github/workspace/fixtures:ro" -w /github/workspace \
            -e INPUT_PATHS='fixtures/migrations/safe_09_refresh_matview_concurrent.sql' \
            -e INPUT_SEVERITY='critical,warning' -e INPUT_FORMAT='json' \
            safemigrate-lint:ci
