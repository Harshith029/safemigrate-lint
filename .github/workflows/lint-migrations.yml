name: Lint migrations

on:
  pull_request:
    paths:
      - 'fixtures/smoke/**/*.sql'

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint migration SQL
        uses: ./
        with:
          paths: 'fixtures/smoke/**/*.sql'
          severity: 'critical,warning'
          format: 'markdown'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
