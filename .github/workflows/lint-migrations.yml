name: Lint migrations

on:
  pull_request:
    paths:
      - 'fixtures/migrations/**/*.sql'

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint migration SQL
        # Findings make the action exit non-zero; like the README tells users,
        # don't fail the job on that — the safemigrate-lint Check Run is the signal.
        continue-on-error: true
        uses: ./
        with:
          paths: 'fixtures/migrations/**/*.sql'
          severity: 'critical,warning'
          format: 'markdown'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
